name: ✨ 功能请求
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！提交前请先[搜索现有 Issue](https://github.com/NaivG/bilimusic/issues?q=is%3Aissue)，避免重复提交。
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰简洁地描述你想要的功能
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 这个功能能解决什么问题？在什么情况下会用到？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方式
      description: 如有想法，描述你期望的交互或实现方式，也可以附上参考产品的截图
  - type: dropdown
    id: platforms
    attributes:
      label: 相关平台
      description: 该功能涉及哪些平台（可多选）
      multiple: true
      options:
        - 全部平台
        - Windows
        - Linux
        - Android
        - macOS
        - iOS
        - TUI（终端客户端）
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解需求的内容
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索并确认没有重复或相似的功能请求
        - label: 我认为该功能符合项目定位
