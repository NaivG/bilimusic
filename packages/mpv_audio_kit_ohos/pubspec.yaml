name: mpv_audio_kit_ohos
description: >-
  OpenHarmony / HarmonyOS 上运行 mpv_audio_kit 的引导层：定位并加载 libmpv.so，
  按 libmpv 的 API 契约把进程 LC_NUMERIC 修成 C，并在启动阶段给出可读的自检结果。
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  ffi: ^2.1.3
  mpv_audio_kit: ^0.4.6

dev_dependencies:
  flutter_lints: ^6.0.0
